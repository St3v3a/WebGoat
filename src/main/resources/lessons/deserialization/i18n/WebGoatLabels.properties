insecure-deserialization.title=Insecure Deserialization

insecure-deserialization.invalidversion=The serialization id does not match. Probably the version has been updated. Let's try again.
insecure-deserialization.expired=The task timestamp is outside the accepted window.
insecure-deserialization.wrongobject=This serialized object type is not accepted.
insecure-deserialization.stringobject=That is not the VulnerableTaskHolder object. However a plain String is harmless. Let's try again with the right object.
insecure-deserialization.safe=The task data was read without executing its action.


insecure-deserialization.hints.1=The endpoint accepts a limited set of serialized data types.
insecure-deserialization.hints.2=A task holder may be read as data, but its action is not executed.
insecure-deserialization.hints.3=Nested or unsupported object graphs are rejected before their callbacks run.
